<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineSubz - Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#0a0a0a;color:white}.card:hover{transform:scale(1.05)}.scrollbar-hide::-webkit-scrollbar{display:none}</style>
</head>
<body>
<header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-extrabold text-red-600">CineSubz</h1>
    <div class="flex gap-2">
      <input id="searchInput" placeholder="Search movie..." class="bg-white/10 px-4 py-2 rounded-full w-40 md:w-80 outline-none focus:ring-2 focus:ring-red-600">
      <button onclick="doSearch()" class="bg-red-600 px-5 py-2 rounded-full font-semibold">Search</button>
    </div>
  </div>
</header>

<div id="hero" class="max-w-7xl mx-auto px-4 mt-6 hidden">
  <div class="h-[400px] rounded-2xl bg-gradient-to-r from-red-900 to-black p-8 flex flex-col justify-end"></div>
</div>

<main class="max-w-7xl mx-auto px-4 mt-8 pb-20">
  <div class="flex gap-4 mb-6 overflow-x-auto scrollbar-hide">
    <button onclick="loadHome()" class="tab bg-red-600 px-5 py-2 rounded-full whitespace-nowrap">Home</button>
    <button onclick="loadList('movies')" class="tab bg-white/10 px-5 py-2 rounded-full whitespace-nowrap">Movies</button>
    <button onclick="loadList('tvshows')" class="tab bg-white/10 px-5 py-2 rounded-full whitespace-nowrap">TV Shows</button>
    <button onclick="loadList('genre/sinhala')" class="tab bg-white/10 px-5 py-2 rounded-full whitespace-nowrap">Sinhala</button>
  </div>

  <h2 id="sectionTitle" class="text-xl font-bold mb-4">Trending Now</h2>
  <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
    <p class="text-white/50">Loading...</p>
  </div>

  <div id="detailModal" class="fixed inset-0 bg-black/90 z-[100] hidden overflow-y-auto p-4">
    <div class="max-w-4xl mx-auto bg-zinc-900 rounded-2xl overflow-hidden mt-10">
      <div class="p-6">
        <button onclick="closeModal()" class="float-right bg-white/10 px-4 py-1 rounded-full">Close X</button>
        <div id="detailContent"></div>
      </div>
    </div>
  </div>
</main>

<script>
// ===== ඔයාගේ LIVE API එක =====
const API_BASE = 'https://sufficiently-advances-operating-relations.trycloudflare.com';

async function api(path){
  const res = await fetch(`${API_BASE}${path}`);
  return res.json();
}

async function loadHome(){
  document.getElementById('sectionTitle').innerText = 'Trending Now';
  document.getElementById('grid').innerHTML = 'Loading...';
  try{
    const data = await api('/home');
    // API eke format eka anuwa array eka ganna
    const items = data.data || data.trending || data.movies || data || [];
    renderGrid(items);
  }catch(e){
    document.getElementById('grid').innerHTML = `<p class="text-red-400">API expire wela. Aluth link eka API_BASE eke danna.<br>${e}</p>`;
  }
}

async function loadList(type){
  document.getElementById('sectionTitle').innerText = type.toUpperCase();
  document.getElementById('grid').innerHTML = 'Loading...';
  const data = await api(`/${type}?page=1`);
  const items = data.data || data.results || data || [];
  renderGrid(items);
}

async function doSearch(){
  const q = document.getElementById('searchInput').value;
  if(!q) return;
  document.getElementById('sectionTitle').innerText = `Search: ${q}`;
  document.getElementById('grid').innerHTML = 'Searching...';
  const data = await api(`/search?query=${encodeURIComponent(q)}`);
  const items = data.data || data.results || data || [];
  renderGrid(items);
}

function renderGrid(items){
  if(!items || items.length==0){
    document.getElementById('grid').innerHTML = 'No results';
    return;
  }
  document.getElementById('grid').innerHTML = items.map(item=>{
    const title = item.title || item.name || 'No Title';
    const img = item.image || item.poster || item.thumbnail || 'https://via.placeholder.com/300x450?text=No+Image';
    const link = item.link || item.url || '';
    return `
    <div onclick="openDetail('${encodeURIComponent(link)}','${encodeURIComponent(title)}')" class="card cursor-pointer bg-zinc-900 rounded-xl overflow-hidden transition-all">
      <img src="${img}" class="w-full h-72 object-cover">
      <div class="p-3"><p class="text-sm font-semibold truncate">${title}</p></div>
    </div>`;
  }).join('');
}

async function openDetail(encodedUrl, encodedTitle){
  const url = decodeURIComponent(encodedUrl);
  if(!url) return;
  document.getElementById('detailModal').classList.remove('hidden');
  document.getElementById('detailContent').innerHTML = 'Loading details...';
  try{
    const data = await api(`/detail?url=${encodeURIComponent(url)}`);
    const dls = await api(`/download?url=${encodeURIComponent(url)}`);
    document.getElementById('detailContent').innerHTML = `
      <h2 class="text-2xl font-bold mb-2">${decodeURIComponent(encodedTitle)}</h2>
      <p class="text-white/60 mb-4">${data.plot || data.description || ''}</p>
      <img src="${data.image || data.poster || ''}" class="w-full max-h-96 object-contain rounded-xl mb-4">
      <h3 class="font-bold mb-2">Download Links:</h3>
      <div class="space-y-2">${(dls.data || dls.links || []).map(l=>`<a href="${l.url||l.link}" target="_blank" class="block bg-red-600 p-3 rounded-lg text-center">${l.quality||l.title||'Download'}</a>`).join('') || 'No links found'}</div>
    `;
  }catch(e){
    document.getElementById('detailContent').innerHTML = 'Error loading';
  }
}
function closeModal(){ document.getElementById('detailModal').classList.add('hidden'); }

loadHome();
</script>
</body>
</html>
